name: Release

# 发布流水线：CI 里编译 → 签名 → 发 GitHub Release。全程不需要本地构建。
#
# 版本号规则（26.6.1 起，**不再带 `mod`**）：
#   versionName 就是干净的三段号，如 `26.6.1`；tag 为 `v26.6.1`；
#   APK 名为 `Han1meViewer-v26.6.1.apk`（由 app/build.gradle.kts 的
#   androidComponents.onVariants 决定，不要在这里另写一套命名）。
#   ⚠️ 历史上的 `v26.3.2-mod.x` 是另一套写法，本工作流的触发条件仍兼容它
#      （见下面的 `v*`），但新版本一律用三段号。
#
# 「检查更新」不读 tag，而是读仓库 mod 分支根目录的 update.json，
# 版本号写死在 json 的 versionCode 字段里。所以：
#   - tag 必须与 update.json 的 downloadUrl 中那一段一致：v<versionName>
#   - APK 文件名必须是 Han1meViewer-v<versionName>.apk
# 本工作流从编译产物文件名反推 tag，保证 tag / 文件名 / update.json 三者对得上。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   RELEASE_KEYSTORE_BASE64      release keystore 的 base64（单行，无换行）
#   RELEASE_KEYSTORE_PASSWORD    keystore.password
#   RELEASE_KEY_ALIAS            key.alias（本仓库为 hanime）
#
# 触发方式：
#   1) 推 tag：git tag v26.6.1 && git push origin v26.6.1
#   2) 网页 Actions → Release → Run workflow（可勾选发布为预发布）

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '发布为预发布（客户端走 releases/latest 会取不到预发布版）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      # 带 v 前缀的版本 tag 一律触发。历史上是 `v*-mod.*`，26.6.1 起改成三段号，
      # 两者都落在这个模式里。
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 用 setup-gradle 直接装官方 9.4.1，绕开 gradle-wrapper.properties 里指向的
      # 腾讯云镜像（CI 上没必要，且多一个不可控依赖）。
      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ⚠️ 2026-09-15：这一步曾经把发布整体卡死（tag 推上去了、Release 一直不出来），
          #    两处坑都修在这里，别再退回去。
          #
          # 【坑 1】license 自动应答对不上新版 sdkmanager
          #   runner 镜像把 SDK 的 cmdline-tools 升到了 **16.0**（预装的
          #   `cmdline-tools/latest` 还是 12.0，action 判定 "Wrong version" 于是改用
          #   `cmdline-tools/16.0/bin/sdkmanager`）。新版 `sdkmanager --licenses` 改成了
          #   **两级提示**：先问一次 `Review licenses that have not been accepted (y/N)?`，
          #   再对每条 license 各问一次 `Accept? (y/N):`。而 action 只往 stdin 喂 **10 个
          #   `y`**，不够 7 次以上 ⇒ 剩下的没接受 ⇒ 命令以非零码退出 ⇒ 步骤失败。
          #   → 关掉 action 的 license 步骤，改由下面的「Install required SDK packages」
          #     用 `yes`（无限个 y）自己喂。
          accept-android-sdk-licenses: false
          #
          # 【坑 2】`packages` 的默认值里有个已经下架的包
          #   action 的 `packages` 默认值是 `tools platform-tools`，而 Google 的 SDK 仓库里
          #   **已经没有 `tools` 这个包了** ⇒ `sdkmanager tools` 报
          #   `Warning: Failed to find package 'tools'` 并 exit 1。
          #   → 传空串。看 action 的实现是 `getInput('packages').split(' ').filter(Boolean)`
          #     再 `for (pkg of packages)`，空串得到空列表、**整个安装循环不执行**
          #     （不是「跑一次不带参数的 sdkmanager」）。platform-tools 镜像里本来就有，
          #     且构建并不需要它。
          packages: ''

      - name: Install required SDK packages
        run: |
          # 先接受 license：`--licenses` 与 `--install` 都接上 `yes`，
          # 万一某个包还要单独确认也不会卡住。失败不致命（下一步会报真错）。
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "licenses 目录："; ls -1 "$ANDROID_SDK_ROOT/licenses" 2>/dev/null || echo "(空)"

          # compileSdk = 37  → platforms;android-37.0
          # 原生库 libchino.so 走 CMake 3.22.1 + NDK 28.2.13676358
          yes 2>/dev/null | sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ndk   : $(ls "$ANDROID_SDK_ROOT/ndk"   | tr '\n' ' ')"
          echo "cmake : $(ls "$ANDROID_SDK_ROOT/cmake" | tr '\n' ' ')"

      - name: Decode release keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::缺少 Secret RELEASE_KEYSTORE_BASE64，无法为 release APK 签名。"
            echo "::error::本地执行：base64 -w0 ~/.android/keystore.jks | gh secret set RELEASE_KEYSTORE_BASE64 -R ddsmie4t2g/HanimeViewer"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KS" | base64 -di > "$HOME/.android/keystore.jks"
          echo "keystore 已写入 $HOME/.android/keystore.jks（$(stat -c%s "$HOME/.android/keystore.jks") 字节）"

      # ⚠️ app/build.gradle.kts 只认 local.properties 里的签名键（没有环境变量回退），
      #    所以这里现造一份给 CI 用。local.properties 本身被 .gitignore 忽略，不会入库。
      - name: Write local.properties (sdk.dir + signing)
        env:
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::缺少 Secret RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS。"
            exit 1
          fi
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "keystore.file=$HOME/.android/keystore.jks"
            echo "keystore.password=$STORE_PASS"
            echo "key.alias=$KEY_ALIAS"
          } > local.properties
          echo "local.properties 已生成："
          sed 's/\(password=\).*/\1***/' local.properties

      - name: Build release APK
        run: gradle --console=plain --stacktrace :app:assembleRelease

      - name: Resolve version from APK filename
        id: ver
        run: |
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -n1)
          test -n "$APK" || { echo "::error::未找到 Han1meViewer-v*.apk"; exit 1; }

          VERSION="$(basename "$APK" .apk)"
          VERSION="${VERSION#Han1meViewer-v}"
          TAG="v${VERSION}"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK = $APK"
          echo "TAG = $TAG"

      # native 层 cpp/chino.h 的 EXPECTED_SIG_HASH 与签名证书硬绑定：指纹不一致时
      # 播放页会被 native 校验直接拦下。这里先自检 —— 宁可发布失败，也不要发出一个
      # 「装得上但播不了」的包。
      - name: Verify APK signature matches chino.h EXPECTED_SIG_HASH
        env:
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -n1 \
            | sed 's/.*: *//' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          EXPECTED="b3ddc86cac6c6b02ac5d7a2dd40b48e2d1ee8287298dc0355fe0c048644b7a63"
          echo "APK 证书 SHA-256 : $DIGEST"
          echo "chino.h 期望值   : $EXPECTED"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::签名指纹与 cpp/chino.h 的 EXPECTED_SIG_HASH 不一致，播放页会被 native 校验拦下。"
            exit 1
          fi
          echo "签名指纹一致 ✔"

      # 即使后面的 Release 创建失败，APK 也能从 workflow artifact 里捞回来。
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.tag }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Compose release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "第三方 Hanime1 客户端（数据源 hanime1 镜像族 / nJAV / Pornhub）"
            echo
            echo "- 产物：arm64-v8a 单 ABI APK"
            echo "- 版本：$TAG"
            echo "- 签名证书 SHA-256：B3:DD:C8:6C:AC:6C:6B:02:AC:5D:7A:2D:D4:0B:48:E2:D1:EE:82:87:29:8D:C0:35:5F:E0:C0:48:64:4B:7A:63"
            echo
            echo "### 更新内容"
            echo
            # 发布说明直接取 update.json 的 updateDescription（与「检查更新」弹窗里
            # 用户看到的**逐字一致**）。比 `git log -15` 好：日志里的提交标题是给
            # 自己看的（带版本号、带「+」这种缩写），用户读起来没有上下文。
            jq -r '.updateDescription' update.json
            echo
            echo
            echo "> 本线的「检查更新」读取本仓库 mod 分支的 update.json；发版后请确认该文件的 versionCode / downloadUrl 已指向本 release。"
            echo "> 安装提示：若手机上装的是 debug 版（签名不同），需先卸载再安装本版本。"
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.ver.outputs.apk }}
          body_path: release-notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}

      # 客户端「检查更新」优先走 jsDelivr（国内可直连），但 jsDelivr 对
      # gh/<owner>/<repo>@<branch>/<file> 有 12 小时的 s-maxage 缓存，
      # **且缓存键不含 query string** —— 所以在 APK 侧拼 `?t=<时间戳>` 完全无效。
      # 不主动刷的话，发版后客户端最长 12 小时都还拿到旧的 update.json，
      # 表现就是「明明发了新版，检查更新却说不更新」。
      #
      # purge 失败不影响发布（|| true），客户端还有 raw 那条回退源兜底。
      - name: Purge jsDelivr cache for update.json
        run: |
          echo "Purging jsDelivr: gh/ddsmie4t2g/HanimeViewer@mod/update.json"
          curl -sS -m 30 "https://purge.jsdelivr.net/gh/ddsmie4t2g/HanimeViewer@mod/update.json" || true
          echo
