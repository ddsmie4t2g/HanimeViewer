permissions:
  contents: read
name: Pull Request Check

# PR 到 main 时做一次编译验证。构建前提与 ci.yml 完全相同
# （Gradle ≥ 9.4.1 + NDK + CMake），原因见 ci.yml 顶部注释。
# 原来的 `./gradlew buildDebug -x lint` 是必失败写法（task 不存在 + 缺 NDK），已修正。

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 两个坑的完整说明在 release.yml 里，这里只记结论：
          #   1) 新版 cmdline-tools(16.0) 的 `sdkmanager --licenses` 是两级提示，
          #      action 只喂 10 个 `y` 不够 → 关掉，改由下面用 `yes` 自己喂。
          #   2) `packages` 默认含 `tools`，而该包已从 Google 仓库下架 → 传空串跳过安装。
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install required SDK packages
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true

          yes 2>/dev/null | sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: gradle --console=plain :app:assembleDebug
